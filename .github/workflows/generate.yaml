---
name: Generate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Generate Client
        run: make generate-client

      - name: Ensure Git is clean
        run: |
          git diff --exit-code --compact-summary
